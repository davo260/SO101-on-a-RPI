# so101_bridge.ini - configuración de mqtt_bridgeV4.py
#
# - Los comentarios van SIEMPRE en líneas aparte: un '#' o ';' dentro de un valor
#   (por ejemplo, en la clave) se conserva tal cual.
# - Una variable de entorno con el mismo nombre que una clave (p. ej. LEADER_PORT=/tmp/x)
#   tiene prioridad sobre este archivo.
# - Este archivo contiene la clave de MQTT: protégelo con  chmod 600 so101_bridge.ini
#   y NO lo subas a git (añádelo a .gitignore).

#cambiar los valores por los valores reales a utilizar (ip broker_mqtt, usuario, contrasena, puerto serial)

[mqtt]
# IP (o nombre) del servidor donde corre Mosquitto
MQTT_BROKER = x.x.x.x  #ip asignada por tailscale
MQTT_PORT = 1883   #puerto asignado del mqtt
MQTT_USER = user   #usuario asignado al cliente mqtt
MQTT_PASSWORD = xxxxx    #contrasena asignada al cliente mqtt

[serial]
# Puerto donde se ESCRIBEN las consignas (brazo líder).
# Los /dev/pts/N cambian al reiniciar fake_bus.py; con bus_mux.py usa los enlaces estables,
# p. ej. /tmp/so101_leader_bridge y /tmp/so101_follower_bridge.
LEADER_PORT = /dev/so101_leader   #puerto serial usb del brazo lider
# Puerto donde se LEE el estado (brazo seguidor)
FOLLOWER_PORT = /dev/so101_follower #puerto serial usb del brazo seguidor
BAUDRATE = 1000000

[daemon]
# De dónde obtiene el puente el modo de operación (teleop, estop, idle, reset, hold) y las fallas:
#   cmd  -> lo deduce de los comandos de modo que ve pasar por so101/cmd.
#           Es el modo SOLICITADO, no confirmado por el demonio (en so101/state: "mode_source": "cmd").
#   mqtt -> lo lee de un tópico MQTT donde el demonio (o su pasarela) lo publica.
#           Es el modo CONFIRMADO ("mode_source": "daemon"). Requiere DAEMON_TOPIC.
#   none -> no informa modo (el dashboard recibe "unknown").
MODE_SOURCE = ctl
SO101CTL = so101ctl
DAEMON_POLL_S = 0.5
DAEMON_CONTROL = 1
# Solo con MODE_SOURCE = mqtt: tópico donde el demonio publica su modo y fallas.
# Debe ser distinto de so101/cmd, so101/state, so101/event y so101/cmd/result.
#DAEMON_TOPIC = ctl python3 mqtt_bridgeV6.py -c ~/brazoRobotico/SO101-on-a-RPI/driver/bridge/so101_bridge.ini

# Claves del JSON que publica el demonio. Si publica solo texto plano con el modo, no se usan.
MODE_KEY = mode
FAULTS_KEY = faults

# Solo con mqtt: segundos sin recibir nada del demonio tras los cuales el modo pasa a "unknown"
# y se declara la falla DAEMON_NO_REPORT. 0 = desactivado (úsalo si el demonio solo publica al cambiar).
MODE_STALE_S = 0
